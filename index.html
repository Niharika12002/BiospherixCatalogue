<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BioSpherix Layout Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

<!-- React + Babel via CDN (Option A: single-file build for GitHub Pages) -->
<!-- Using development build for clearer error messages during testing -->
<script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

<style>
:root {
  /* Official BioSpherix brand palette (2024) */
  --navy:    #0B436A;       /* PMS 287 — official brand navy */
  --navy-d:  #232D48;       /* PMS 2767C — deep navy for hover/depth */
  --orange:  #E57200;       /* PMS 158C — official brand orange (decorative use only) */
  --orange-d:#C75F1E;       /* Brand hover state */
  --orange-text:   #8E3C0F; /* AAA-compliant orange for text (7.49:1 on white) */
  --orange-text-d: #6B2F08; /* Hover state for orange text/button */
  --sky:     #8EC2E1;       /* PMS 304C — light blue accent (available for future use) */
  --pearl:   #C8CBD2;       /* PMS 2767C 25% — light grey */
  --bg:      #F4F6FA;
  --surface: #FFFFFF;
  --border:  #E2EAF4;
  --border-strong: #6B7B91; /* AAA UI borders (4.31:1, passes WCAG 1.4.11) */
  --grid:    #EEF2F7;
  --text:    #1A2332;       /* 15.78:1 on white — AAA */
  --text-2:  #2E3A52;       /* 11.39:1 on white — AAA */
  --text-3:  #3D4C66;       /* 8.66:1 on white, 8.01:1 on bg — AAA */
  --chamber-tint: #EFF4FB;
  --controller-tint: #FFF4EC;
  --third-tint: #F4F0EA;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'IBM Plex Sans', sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }

.mono { font-family: 'IBM Plex Mono', monospace; }

#root { height: 100vh; }

/* ============================================================
   APP SHELL
============================================================ */
.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  background: var(--navy);
  color: #fff;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--orange);
  gap: 20px;
  flex-shrink: 0;
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 18px;
  min-width: 0;
}

.topbar-logo {
  height: 56px;
  width: auto;
  display: block;
  flex-shrink: 0;
}

.topbar-titleblock {
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-left: 1px solid rgba(255,255,255,0.18);
  padding-left: 18px;
  min-width: 0;
}

.topbar-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.1;
  color: #fff;
}

.topbar-sub {
  font-size: 10px;
  color: rgba(255,255,255,0.72);
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 500;
}

.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}

.btn {
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 4px;
  border: 1px solid transparent;
  transition: all 0.15s ease;
  letter-spacing: 0.01em;
}
.btn-primary {
  background: var(--orange-text);
  color: #fff;
  border-color: var(--orange-text);
}
.btn-primary:hover { background: var(--orange-text-d); border-color: var(--orange-text-d); }
.btn-ghost {
  background: transparent;
  color: #fff;
  border-color: rgba(255,255,255,0.3);
}
.btn-ghost:hover { background: rgba(255,255,255,0.1); }
.btn-quiet {
  background: transparent;
  color: var(--text-2);
  border-color: var(--border);
}
.btn-quiet:hover { background: var(--bg); color: var(--text); }

/* ============================================================
   PROJECT META BAR
============================================================ */
.metabar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: grid;
  grid-template-columns: 1.4fr 1.4fr 1fr 1fr 1fr;
  gap: 18px;
  align-items: end;
  flex-shrink: 0;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.field-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  font-family: 'IBM Plex Mono', monospace;
}

.field-input {
  background: transparent;
  border: none;
  border-bottom: 1.5px solid var(--border-strong);
  padding: 4px 0;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s ease;
}
.field-input:focus { border-bottom-color: var(--navy); }

.field-input.mono { font-family: 'IBM Plex Mono', monospace; }

.field-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.field-num {
  width: 50px;
  background: transparent;
  border: none;
  border-bottom: 1.5px solid var(--border-strong);
  padding: 4px 0;
  font-size: 14px;
  font-weight: 500;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text);
  outline: none;
  text-align: center;
}
.field-num:focus { border-bottom-color: var(--navy); }

.field-sep {
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text-3);
  font-size: 13px;
}

/* ============================================================
   MAIN LAYOUT
============================================================ */
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 260px 1fr 340px;
  min-height: 0;
  overflow: hidden;
}

@media (max-width: 1200px) {
  .workspace { grid-template-columns: 220px 1fr 300px; }
}

/* ============================================================
   SIDEBAR — COMPONENT LIBRARY
============================================================ */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 16px;
  overflow-y: auto;
}

.section-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  font-family: 'IBM Plex Mono', monospace;
  margin-bottom: 10px;
  padding-left: 4px;
}

.section-group {
  margin-bottom: 22px;
}

.lib-item {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 10px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.12s ease;
  position: relative;
}
.lib-item:hover {
  border-color: var(--navy);
  background: #FAFBFD;
  transform: translateX(2px);
}
.lib-item:active {
  transform: translateX(0);
  background: var(--chamber-tint);
}

.lib-item-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.lib-item-thumb {
  flex: 0 0 72px;
  width: 72px;
  height: 48px;
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  display: grid;
  place-items: center;
}
.lib-item-thumb img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.lib-item-thumb-empty {
  background: var(--bg);
  color: var(--text-3);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.05em;
}

.lib-item-body {
  flex: 1;
  min-width: 0;
}

.lib-item-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.005em;
  line-height: 1.2;
}

.lib-item-variant {
  font-size: 10.5px;
  color: var(--text-2);
  font-weight: 400;
  line-height: 1.3;
  margin-top: 2px;
}

.lib-item-meta {
  font-size: 10px;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text-3);
  margin-top: 3px;
  letter-spacing: 0.02em;
}

.lib-item-part {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 11px;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--orange-text);
  font-weight: 600;
  letter-spacing: 0.04em;
  transition: opacity 0.12s ease;
}
.lib-item:hover .lib-item-part,
.lib-item:focus-within .lib-item-part {
  opacity: 0;
}

.canvas-caption {
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
  width: 100%;
  font-size: 10px;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.lib-hint {
  font-size: 11px;
  color: var(--text-3);
  padding: 8px 4px;
  font-style: italic;
  line-height: 1.5;
}

/* ============================================================
   LIBRARY ACTIONS — edit/delete + add buttons
============================================================ */
.lib-item { position: relative; }

.lib-item-actions {
  position: absolute;
  top: 6px;
  right: 6px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.12s ease;
}
.lib-item:hover .lib-item-actions,
.lib-item:focus-within .lib-item-actions {
  opacity: 1;
}

.lib-action-btn {
  width: 22px;
  height: 22px;
  border-radius: 3px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-2);
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  transition: all 0.12s ease;
}
.lib-action-btn:hover {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}
.lib-action-delete:hover {
  background: #B7281C;
  border-color: #B7281C;
}

.lib-add-btn {
  display: block;
  width: 100%;
  text-align: center;
  background: transparent;
  border: 1px dashed var(--border-strong);
  border-radius: 4px;
  padding: 8px;
  margin-top: 2px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.12s ease;
  letter-spacing: 0.01em;
}
.lib-add-btn:hover {
  border-color: var(--navy);
  color: var(--navy);
  background: var(--surface);
}

.lib-add-category-btn {
  display: block;
  width: 100%;
  text-align: center;
  background: var(--navy);
  border: 1px solid var(--navy);
  border-radius: 4px;
  padding: 9px;
  margin-top: 8px;
  margin-bottom: 14px;
  font-size: 11.5px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  transition: all 0.12s ease;
  letter-spacing: 0.02em;
}
.lib-add-category-btn:hover {
  background: var(--navy-d);
  border-color: var(--navy-d);
}

/* ============================================================
   MODAL — component editor
============================================================ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(11,67,106,0.55);
  display: grid;
  place-items: center;
  z-index: 100;
  padding: 24px;
  overflow-y: auto;
}

.modal {
  background: var(--surface);
  border-radius: 8px;
  width: 100%;
  max-width: 640px;
  box-shadow: 0 20px 60px rgba(11,67,106,0.35);
  border: 1px solid var(--border);
  overflow: hidden;
}

.modal-head {
  background: var(--bg);
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}

.modal-eyebrow {
  font-size: 10px;
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  font-weight: 600;
  margin-bottom: 4px;
}

.modal-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.modal-close {
  background: transparent;
  border: none;
  font-size: 24px;
  color: var(--text-2);
  cursor: pointer;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 4px;
  padding: 0;
  line-height: 1;
}
.modal-close:hover {
  background: var(--surface);
  color: var(--text);
}

.modal-form {
  padding: 20px 22px 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.form-row {
  display: flex;
  gap: 14px;
  align-items: flex-end;
}

.form-row-inline {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
  min-width: 0;
}

.form-field label {
  font-size: 10px;
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  font-weight: 600;
}

.form-field .req {
  color: var(--orange-text);
  margin-left: 2px;
}

.form-hint {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 10px;
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0.01em;
  color: var(--text-3);
  margin-left: 4px;
  font-style: italic;
}

.form-field input[type="text"],
.form-field input[type="number"],
.form-field select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  outline: none;
  font-family: inherit;
  transition: border-color 0.12s ease;
}

.form-field input:focus,
.form-field select:focus {
  border-color: var(--navy);
  box-shadow: 0 0 0 2px rgba(11,67,106,0.15);
}

.form-field input[type="number"] {
  font-family: 'IBM Plex Mono', monospace;
}

.form-unit {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-3);
  font-weight: 500;
  flex-shrink: 0;
}

.form-prefix { order: -1; }

.form-link-btn {
  background: transparent;
  border: none;
  color: var(--navy);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 0;
  font-family: inherit;
  white-space: nowrap;
}
.form-link-btn:hover { text-decoration: underline; }

.form-error {
  background: #FFF4EC;
  border: 1px solid var(--orange-text);
  color: var(--orange-text-d);
  font-size: 12px;
  padding: 8px 12px;
  border-radius: 4px;
  font-weight: 500;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 4px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

/* ============================================================
   CANVAS AREA
============================================================ */
.canvas-area {
  background: var(--bg);
  padding: 24px;
  overflow: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 0;
}

.canvas-wrap {
  display: flex;
  flex-direction: column;
}

.canvas-frame {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 2px;
  box-shadow: 0 1px 3px rgba(27,58,107,0.06);
  user-select: none;
}

/* Engineering blueprint ruler ticks around the canvas */
.ruler-x, .ruler-y {
  position: absolute;
  color: var(--text-3);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 500;
}

.canvas-grid {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.canvas-empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--text-3);
  font-size: 13px;
  text-align: center;
  line-height: 1.7;
  pointer-events: none;
  padding: 40px;
}

.placed {
  position: absolute;
  background: var(--surface);
  border: 1.5px solid var(--navy);
  border-radius: 3px;
  cursor: grab;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 6px 7px;
  overflow: hidden;
  transition: box-shadow 0.12s ease, border-color 0.12s ease;
  box-shadow: 0 1px 2px rgba(27,58,107,0.08);
}
.placed:hover {
  box-shadow: 0 2px 6px rgba(27,58,107,0.18);
}
.placed.dragging {
  cursor: grabbing;
  box-shadow: 0 4px 14px rgba(27,58,107,0.25);
  z-index: 10;
}
.placed.selected {
  border-color: var(--orange-text);
  border-width: 2px;
  padding: 5.5px 6.5px; /* compensate for thicker border so layout doesn't shift */
  box-shadow: 0 0 0 2px rgba(142,60,15,0.18);
}

.placed.t-chamber { background: var(--chamber-tint); }
.placed.t-controller { background: var(--controller-tint); }
.placed.t-thirdparty {
  background: var(--third-tint);
  border-style: dashed;
  border-color: var(--text-2);
}

.placed-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 4px;
  min-height: 0;
}

.placed-name {
  font-size: 11px;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.01em;
  color: var(--text);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.placed-footer {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 6px;
  margin-top: 4px;
  min-width: 0;
}

.placed-dims {
  font-size: 10px;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text-2);
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.placed-part {
  font-size: 10px;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--orange-text);
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  flex-shrink: 0;
}

.remove-btn {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  border-radius: 3px;
  background: var(--orange-text);
  color: #fff;
  border: none;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: grid;
  place-items: center;
  line-height: 1;
  padding: 0;
  margin-top: -1px;
  transition: background 0.12s ease;
}
.remove-btn:hover { background: var(--orange-text-d); }

/* ============================================================
   READOUT PANEL
============================================================ */
.panel {
  background: var(--surface);
  border-left: 1px solid var(--border);
  padding: 20px;
  overflow-y: auto;
}

.panel-section {
  margin-bottom: 24px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.panel-section:last-child { border-bottom: none; }

.panel-h {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  font-family: 'IBM Plex Mono', monospace;
  margin-bottom: 12px;
}

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 18px;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.stat-label {
  font-size: 10px;
  color: var(--text-3);
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.stat-value {
  font-size: 18px;
  font-weight: 600;
  color: var(--navy);
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: -0.01em;
}

.stat-unit {
  font-size: 11px;
  color: var(--text-3);
  font-weight: 500;
  margin-left: 3px;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tag {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 3px;
  background: var(--chamber-tint);
  color: var(--navy);
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.02em;
  border: 1px solid var(--border);
}

.tag.empty {
  color: var(--text-3);
  background: transparent;
  font-style: italic;
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 400;
  border: 1px dashed var(--border-strong);
}

.parts-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.parts-list li {
  display: flex;
  justify-content: space-between;
  padding: 6px 8px;
  background: var(--bg);
  border-radius: 3px;
  font-size: 12px;
}

/* ============================================================
   PRICING SECTION
============================================================ */
.pricing-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}

.pricing-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color 0.12s ease, background 0.12s ease;
}
.pricing-item:hover {
  border-color: var(--border-strong);
}
.pricing-item.selected {
  border-color: var(--orange-text);
  background: #FFFFFF;
  box-shadow: 0 0 0 1px var(--orange-text);
}

.pricing-item-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}

.pricing-item-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
  flex: 1;
  min-width: 0;
}
.pricing-item-variant {
  color: var(--text-2);
  font-weight: 400;
}
.pricing-item-part {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--orange-text);
  font-weight: 600;
  letter-spacing: 0.02em;
}

.pricing-item-base {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}

.pricing-item-custom {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  font-size: 11.5px;
  color: var(--text-2);
  cursor: pointer;
  user-select: none;
}
.pricing-item-custom input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--border-strong);
  border-radius: 2px;
  background: white;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  margin: 0;
}
.pricing-item-custom input[type="checkbox"]:checked {
  background: var(--orange-text);
  border-color: var(--orange-text);
}
.pricing-item-custom input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  left: 3px;
  top: 0px;
  width: 4px;
  height: 8px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.pricing-item-custom-label {
  flex: 1;
}
.pricing-item-custom-pct {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--orange-text);
}

.pricing-item-slider {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0 4px;
}
.pricing-item-slider input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.pricing-item-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--orange-text);
  cursor: pointer;
  border: 2px solid white;
  box-shadow: 0 0 0 1px var(--orange-text);
}
.pricing-item-slider input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--orange-text);
  cursor: pointer;
  border: 2px solid white;
  box-shadow: 0 0 0 1px var(--orange-text);
}

.pricing-item-num {
  width: 48px;
  background: white;
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  padding: 3px 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  outline: none;
  text-align: right;
}
.pricing-item-num:focus { border-color: var(--navy); }
.pricing-item-num::-webkit-outer-spin-button,
.pricing-item-num::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.pricing-item-num[type="number"] { -moz-appearance: textfield; }

.pricing-item-num-unit {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-3);
}

.pricing-item-markup {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-2);
  padding: 4px 0;
  font-family: 'IBM Plex Sans', sans-serif;
}
.pricing-item-markup .mono {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 500;
  color: var(--orange-text);
}

.pricing-item-total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: 6px;
  margin-top: 4px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-2);
  letter-spacing: 0.02em;
}
.pricing-item-total-amt {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.pricing-divider {
  height: 2px;
  background: var(--border);
  margin: 12px 0;
  border-radius: 1px;
}

.pricing-totals {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.pricing-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
}
.pricing-row-label {
  color: var(--text-2);
  font-weight: 500;
  letter-spacing: 0.01em;
}
.pricing-row-amt {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.pricing-row-sub {
  padding-top: 0;
  font-size: 11px;
  color: var(--text-2);
}
.pricing-row-sub .mono {
  font-family: 'IBM Plex Mono', monospace;
  color: var(--orange-text);
}

.pricing-discount {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pricing-discount-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.pricing-discount-controls {
  display: flex;
  align-items: center;
  gap: 4px;
}
.pricing-discount-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.pricing-discount-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--navy);
  cursor: pointer;
  border: 2px solid white;
  box-shadow: 0 0 0 1px var(--navy);
}
.pricing-discount-slider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--navy);
  cursor: pointer;
  border: 2px solid white;
  box-shadow: 0 0 0 1px var(--navy);
}

.pricing-row-final {
  border-top: 2px solid var(--navy);
  padding-top: 12px;
  margin-top: 6px;
  align-items: baseline;
}
.pricing-row-label-final {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--navy);
  font-family: 'IBM Plex Mono', monospace;
}
.pricing-row-amt-final {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.01em;
}

.pricing-disclaimer {
  font-size: 10px;
  color: var(--text-3);
  font-style: italic;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
  line-height: 1.5;
}

.parts-name {
  color: var(--text);
  font-weight: 500;
}

.parts-num {
  font-family: 'IBM Plex Mono', monospace;
  color: var(--orange-text);
  font-weight: 600;
  font-size: 11px;
}

.intent-body {
  font-size: 13px;
  line-height: 1.65;
  color: var(--text);
  background: var(--bg);
  border-left: 3px solid var(--orange);
  padding: 14px 16px;
  border-radius: 0 4px 4px 0;
}

.intent-body em {
  font-style: normal;
  font-weight: 600;
  color: var(--navy);
}

.intent-empty {
  color: var(--text-3);
  font-style: italic;
}

/* ============================================================
   PRINT VIEW
============================================================ */
@media print {
  @page { size: letter; margin: 0.5in; }
  body { background: white; }
  .topbar, .sidebar, .panel-actions, .remove-btn, .metabar-actions { display: none !important; }
  .metabar {
    border-bottom: 2px solid var(--navy);
    padding: 0 0 14px 0;
    margin-bottom: 20px;
    grid-template-columns: 1fr 1fr 1fr 1fr;
  }
  .workspace {
    display: block;
    padding: 0;
  }
  .canvas-area {
    background: white;
    padding: 0;
    margin-bottom: 18px;
    page-break-inside: avoid;
  }
  .canvas-frame {
    box-shadow: none;
    border: 1.5px solid var(--navy);
  }
  .panel {
    border-left: none;
    padding: 0;
    background: white;
  }
  .panel-section { page-break-inside: avoid; }
  .placed { box-shadow: none !important; }
  .placed.selected { border-color: var(--navy) !important; box-shadow: none !important; }
  /* Pricing: hide editor controls, keep totals visible */
  .pricing-item-slider, .pricing-discount-slider, .pricing-disclaimer { display: none !important; }
  .pricing-discount-controls { display: none !important; }
  .pricing-item-custom input[type="checkbox"] { display: none !important; }
  .pricing-item { background: white !important; border-color: var(--border) !important; box-shadow: none !important; }
  .pricing-item.selected { box-shadow: none !important; border-color: var(--border) !important; }
  .pricing-discount { background: white !important; }
}

<!-- Diagnostic: runs before Babel processes the JSX block -->
<script>
  (function() {
    var status = document.getElementById('boot-status');
    var errBox = document.getElementById('boot-error');
    function setStatus(msg) { if (status) status.textContent = msg; }
    function showError(msg) {
      if (errBox) { errBox.style.display = 'block'; errBox.textContent = msg; }
    }
    // Capture any runtime errors during boot
    window.addEventListener('error', function(e) {
      showError('Error: ' + (e.message || e.error) + '\n\nOpen the browser console (F12) for details.');
    });
    // Check dependencies after a short delay
    setTimeout(function() {
      var checks = [];
      checks.push('React: ' + (typeof React !== 'undefined' ? 'loaded ✓' : 'FAILED'));
      checks.push('ReactDOM: ' + (typeof ReactDOM !== 'undefined' ? 'loaded ✓' : 'FAILED'));
      checks.push('Babel: ' + (typeof Babel !== 'undefined' ? 'loaded ✓' : 'FAILED'));
      setStatus(checks.join('\n'));
      if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof Babel === 'undefined') {
        showError('One or more CDN scripts failed to load.\n\nCheck your internet connection, or try:\n1. Hard refresh (Cmd/Ctrl + Shift + R)\n2. Open in a different browser\n3. Serve via local server instead of file://');
      }
    }, 1500);
  })();
</script>

/* ============================================================
   DESIGN INTENT — auto-generated paragraph from current layout
============================================================ */
function generateDesignIntent({ placed, benchW, benchD, clientName, findComp }) {
  if (placed.length === 0) return null;

  const items = placed.map(p => findComp(p.componentId)).filter(Boolean);
  const chambers = items.filter(c => c.type === 'chamber');
  const controllers = items.filter(c => c.type === 'controller');
  const thirds = items.filter(c => c.type === 'thirdparty');

  // Bounding box of placed components
  const bbox = computeBoundingBox(placed, findComp);

  // Union of gases
  const gases = [...new Set(items.flatMap(c => c.gases))];

  // Chamber description
  let chamberPhrase = '';
  if (chambers.length === 1) {
    chamberPhrase = `a ${chambers[0].part} ${chambers[0].variant} C-Chamber`;
  } else if (chambers.length > 1) {
    const variants = chambers.map(c => c.variant).join(' / ');
    chamberPhrase = `${chambers.length} C-Chambers (${variants})`;
  }

  // Controller description
  let ctrlPhrase = '';
  if (controllers.length === 1) {
    ctrlPhrase = `the ${controllers[0].name} for ${controllers[0].cap || 'environmental control'}`;
  } else if (controllers.length > 1) {
    const names = controllers.map(c => c.name).join(', ');
    ctrlPhrase = `${controllers.length} controllers (${names})`;
  }

  // Build sentences
  let sentences = [];

  if (chambers.length && controllers.length) {
    const client = clientName ? ` for <em>${clientName}</em>` : '';
    sentences.push(`This configuration${client} pairs <em>${chamberPhrase}</em> with <em>${ctrlPhrase}</em>, occupying a floor footprint of <em>${bbox.w}″ × ${bbox.d}″</em>.`);
  } else if (chambers.length) {
    sentences.push(`This configuration includes <em>${chamberPhrase}</em>, occupying <em>${bbox.w}″ × ${bbox.d}″</em> of floor space. Add a controller from the library to enable gas regulation.`);
  } else if (controllers.length) {
    sentences.push(`This configuration includes <em>${ctrlPhrase}</em>, occupying <em>${bbox.w}″ × ${bbox.d}″</em>. Add a chamber from the library to define the controlled workspace.`);
  } else {
    sentences.push(`This configuration includes ${thirds.length} third-party component(s), occupying <em>${bbox.w}″ × ${bbox.d}″</em>.`);
  }

  // Capability sentence
  if (gases.length) {
    sentences.push(`The system supports control of <em>${gases.join(', ')}</em>, suitable for ${applicationPhrase(items)}.`);
  }

  // Third-party integration
  if (thirds.length) {
    sentences.push(`The layout integrates <em>${thirds.length}</em> third-party component${thirds.length > 1 ? 's' : ''} for workflow-specific equipment.`);
  }

  // Footprint vs bench remark
  const utilizationW = (bbox.w / benchW * 100).toFixed(0);
  const utilizationD = (bbox.d / benchD * 100).toFixed(0);
  if (bbox.w > 0 && bbox.d > 0) {
    sentences.push(`Total layout uses <em>${utilizationW}%</em> of floor width and <em>${utilizationD}%</em> of floor depth.`);
  }

  return sentences.join(' ');
}

function applicationPhrase(items) {
  const ids = new Set(items.map(i => i.id));
  if (ids.has('oxystr')) return 'live-cell microscopy and perfusion workflows';
  if (ids.has('gt41')) return 'gasotransmitter research (CO/NO/hypoxia studies)';
  if (ids.has('oxyc42')) return 'dynamic cycling protocols and ischemia/reperfusion studies';
  if (ids.has('proxp360')) return 'hypoxia, hyperoxia, and in vivo enclosure work';
  if (ids.has('proxp110') || ids.has('proxc21')) return 'hypoxia, stem cell, and tumor microenvironment studies';
  if (ids.has('proco2')) return 'CO₂-sensitive cell culture applications';
  return 'controlled cell culture and physiologic research';
}

function computeBoundingBox(placed, findComp) {
  if (placed.length === 0) return { w: 0, d: 0, x: 0, y: 0 };
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of placed) {
    const c = findComp(p.componentId);
    if (!c) continue;
    minX = Math.min(minX, p.x);
    minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + c.w);
    maxY = Math.max(maxY, p.y + c.d);
  }
  return {
    w: +(maxX - minX).toFixed(1),
    d: +(maxY - minY).toFixed(1),
    x: minX,
    y: minY,
  };
}

  const [discountPct, setDiscountPct] = useState(0);

  // ---- Library state (components + categories), persisted in localStorage ----
  const STORAGE_KEY = 'biospherix.library.v1';

  const [library, setLibrary] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.components) && Array.isArray(parsed.categories)) {
          return parsed;
        }
      }
    } catch (e) { /* fall through to defaults */ }
    return { components: DEFAULT_COMPONENTS, categories: DEFAULT_CATEGORIES };
  });

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(library)); } catch (e) {}
  }, [library]);

  const components = library.components;
  const categories = library.categories;
  const findCompFn = (id) => findComp(components, id);

  // ---- Editor modal state ----
  const [editorOpen, setEditorOpen] = useState(false);
  const [editorMode, setEditorMode] = useState('add'); // 'add' | 'edit'
  const [editorTarget, setEditorTarget] = useState(null); // component being edited, or category preselect for add

  function openAddComponent(presetCategory) {
    setEditorMode('add');
    setEditorTarget({ category: presetCategory || categories[0] || 'Other' });
    setEditorOpen(true);
  }
  function openEditComponent(componentId) {
    const comp = findCompFn(componentId);
    if (!comp) return;
    setEditorMode('edit');
    setEditorTarget(comp);
    setEditorOpen(true);
  }
  function closeEditor() { setEditorOpen(false); setEditorTarget(null); }

  function saveComponent(draft) {
    // draft: { id?, name, variant, category, w, d, h, weight, gases, part, basePrice, type }
    if (editorMode === 'add') {
      const newId = 'u' + Date.now().toString(36);
      const newComp = { ...draft, id: newId, custom: true };
      // If new category, add it
      setLibrary(prev => {
        const cats = prev.categories.includes(draft.category)
          ? prev.categories
          : [...prev.categories, draft.category];
        return { components: [...prev.components, newComp], categories: cats };
      });
    } else {
      // edit
      setLibrary(prev => {
        const cats = prev.categories.includes(draft.category)
          ? prev.categories
          : [...prev.categories, draft.category];
        return {
          components: prev.components.map(c => c.id === draft.id ? { ...c, ...draft } : c),
          categories: cats,
        };
      });
    }
    closeEditor();
  }

  function deleteComponent(componentId) {
    const comp = findCompFn(componentId);
    if (!comp) return;
    if (!confirm(`Delete "${comp.name}${comp.variant ? ' · ' + comp.variant : ''}" from the library?\n\nAny currently placed copies on the floor will remain.`)) return;
    setLibrary(prev => ({
      ...prev,
      components: prev.components.filter(c => c.id !== componentId),
    }));
  }

  function restoreDefaults() {
    if (!confirm('Restore the default BioSpherix library?\n\nThis replaces your current library with the original 11 components and 3 categories. Any custom components or category edits will be lost. Components placed on the floor are not affected.')) return;
    setLibrary({ components: DEFAULT_COMPONENTS, categories: DEFAULT_CATEGORIES });
  }

  const nextId = useRef(1);

  function toggleCustomization(itemId) {
    setPlaced(prev => prev.map(p => p.id === itemId
      ? { ...p, customization: !p.customization, customizationPct: p.customizationPct ?? 15 }
      : p
    ));
  }

  function setCustomizationPct(itemId, pct) {
    const n = Math.max(0, Math.min(100, Math.round(Number(pct) || 0)));
    setPlaced(prev => prev.map(p => p.id === itemId
      ? { ...p, customizationPct: n }
      : p
    ));
  }

  function setDiscountClamp(v) {
    const n = Math.max(0, Math.min(100, Math.round(Number(v) || 0)));
    setDiscountPct(n);
  }

  function addComponent(componentId) {
    const comp = findCompFn(componentId);
    if (!comp) return;
    const id = `p${nextId.current++}`;
    // Place near top-left, but offset to stack new items
    const offset = (placed.length % 5) * 2;
    const x = Math.min(2 + offset, benchW - comp.w);
    const y = Math.min(2 + offset, benchD - comp.d);
    setPlaced(prev => [...prev, { id, componentId, x: Math.max(0, x), y: Math.max(0, y) }]);
    setSelectedId(id);
  }

  function removePlaced(id) {
    setPlaced(prev => prev.filter(p => p.id !== id));
    if (selectedId === id) setSelectedId(null);
  }

  function clearAll() {
    if (placed.length === 0) return;
    if (!confirm('Clear all placed components?')) return;
    setPlaced([]);
    setSelectedId(null);
  }

  function handlePrint() { window.print(); }

  // Bench size handlers
  function setBenchWClamp(v) {
    const n = Math.max(12, Math.min(120, Math.round(Number(v) || 60)));
    setBenchW(n);
  }
  function setBenchDClamp(v) {
    const n = Math.max(12, Math.min(80, Math.round(Number(v) || 30)));
    setBenchD(n);
  }

  // Stats
  const stats = useMemo(() => {
    const items = placed.map(p => findCompFn(p.componentId)).filter(Boolean);
    const chambers = items.filter(c => c.type === 'chamber').length;
    const controllers = items.filter(c => c.type === 'controller').length;
    const thirds = items.filter(c => c.type === 'thirdparty').length;
    const bbox = computeBoundingBox(placed, findCompFn);
    const knownWeight = items.reduce((acc, c) => acc + (c.weight || 0), 0);
    const unknownWeightCount = items.filter(c => c.weight == null).length;
    const gases = [...new Set(items.flatMap(c => c.gases))];
    const partList = items.map(c => ({ name: c.name + (c.variant && c.variant !== 'placeholder' ? ` — ${c.variant}` : ''), part: c.part }));
    return { chambers, controllers, thirds, bbox, knownWeight, unknownWeightCount, gases, partList };
  }, [placed, components]);

  const intent = useMemo(
    () => generateDesignIntent({ placed, benchW, benchD, clientName, findComp: findCompFn }),
    [placed, benchW, benchD, clientName, components]
  );

  // Pricing — line items, subtotal, discount, total
  const pricing = useMemo(() => {
    const items = placed.map(p => {
      const comp = findCompFn(p.componentId);
      const base = comp?.basePrice || 0;
      const customOn = !!p.customization;
      const customPct = customOn ? (p.customizationPct ?? 15) : 0;
      const markup = base * (customPct / 100);
      const itemTotal = base + markup;
      return { placed: p, comp, base, customOn, customPct, markup, itemTotal };
    });
    const subtotal = items.reduce((s, i) => s + i.itemTotal, 0);
    const discountAmount = subtotal * (discountPct / 100);
    const total = subtotal - discountAmount;
    return { items, subtotal, discountAmount, total };
  }, [placed, discountPct, components]);

  return (
    <div className="app">
      <TopBar
        projectName={projectName}
        onPrint={handlePrint}
        onClear={clearAll}
        onRestoreDefaults={restoreDefaults}
      />
      <MetaBar
        projectName={projectName} setProjectName={setProjectName}
        clientName={clientName}   setClientName={setClientName}
        benchW={benchW} setBenchW={setBenchWClamp}
        benchD={benchD} setBenchD={setBenchDClamp}
      />

      <div className="workspace">
        <Sidebar
          components={components}
          categories={categories}
          onPick={addComponent}
          onEditComponent={openEditComponent}
          onDeleteComponent={deleteComponent}
          onAddComponent={openAddComponent}
        />
        <CanvasArea
          benchW={benchW} benchD={benchD}
          placed={placed} setPlaced={setPlaced}
          selectedId={selectedId} setSelectedId={setSelectedId}
          draggingId={draggingId} setDraggingId={setDraggingId}
          removePlaced={removePlaced}
          findComp={findCompFn}
        />
        <ReadoutPanel
          stats={stats}
          intent={intent}
          clientName={clientName}
          projectName={projectName}
          pricing={pricing}
          discountPct={discountPct}
          setDiscount={setDiscountClamp}
          toggleCustomization={toggleCustomization}
          setCustomizationPct={setCustomizationPct}
          selectedId={selectedId}
          setSelectedId={setSelectedId}
        />
      </div>

      {editorOpen && (
        <ComponentEditor
          mode={editorMode}
          initial={editorTarget}
          categories={categories}
          onSave={saveComponent}
          onCancel={closeEditor}
        />
      )}
    </div>
  );
}

/* ============================================================
   SIDEBAR
============================================================ */
function Sidebar({ components, categories, onPick, onEditComponent, onDeleteComponent, onAddComponent }) {
  // Group components by category, preserving the category order
  const byCategory = {};
  categories.forEach(cat => { byCategory[cat] = []; });
  // Catch any orphans (component whose category isn't in the categories list)
  components.forEach(c => {
    const cat = (c.category && categories.includes(c.category)) ? c.category : (categories[categories.length - 1] || 'Other');
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(c);
  });

  function handleAddCategoryClick() {
    const name = (prompt('Name for the new category:') || '').trim();
    if (!name) return;
    if (categories.includes(name)) {
      alert(`"${name}" is already a category.`);
      return;
    }
    // Open the add-component editor pre-set to the new category — the editor will create it on save
    onAddComponent(name);
  }

  return (
    <div className="sidebar">
      {categories.map(cat => (
        <div className="section-group" key={cat}>
          <div className="section-title">{cat}</div>
          {byCategory[cat].map(c => (
            <LibItem
              key={c.id}
              comp={c}
              onPick={onPick}
              onEdit={onEditComponent}
              onDelete={onDeleteComponent}
            />
          ))}
          <button
            className="lib-add-btn"
            onClick={() => onAddComponent(cat)}
            title={`Add a component to ${cat}`}
          >
            + Add to {cat}
          </button>
        </div>
      ))}

      <button
        className="lib-add-category-btn"
        onClick={handleAddCategoryClick}
        title="Add a new category"
      >
        + Add category
      </button>

      <div className="lib-hint">
        Click a component to add to the floor. Hover any card to edit or remove from the library.
      </div>
    </div>
  );
}

/* ============================================================
   CANVAS AREA — bench grid + placed components
============================================================ */
function CanvasArea({ benchW, benchD, placed, setPlaced, selectedId, setSelectedId, draggingId, setDraggingId, removePlaced, findComp }) {
  // pxPerInch — adapt to fit roughly 720px wide while staying readable
  const MAX_W = 720;
  const MAX_H = 460;
  const pxPerInchByW = MAX_W / benchW;
  const pxPerInchByH = MAX_H / benchD;
  const pxPerInch = Math.min(pxPerInchByW, pxPerInchByH, 14);
  const canvasW = benchW * pxPerInch;
  const canvasH = benchD * pxPerInch;

  const canvasRef = useRef(null);
  const dragState = useRef(null);

  function onPlacedMouseDown(e, item) {
    e.stopPropagation();
    setSelectedId(item.id);
    setDraggingId(item.id);
    const rect = canvasRef.current.getBoundingClientRect();
    const mouseXin = (e.clientX - rect.left) / pxPerInch;
    const mouseYin = (e.clientY - rect.top) / pxPerInch;
    dragState.current = {
      id: item.id,
      offsetXin: mouseXin - item.x,
      offsetYin: mouseYin - item.y,
    };
  }

  function onCanvasMouseMove(e) {
    if (!dragState.current) return;
    const { id, offsetXin, offsetYin } = dragState.current;
    const placedItem = placed.find(p => p.id === id);
    if (!placedItem) return;
    const comp = findComp(placedItem.componentId);
    if (!comp) return;
    const rect = canvasRef.current.getBoundingClientRect();
    const mouseXin = (e.clientX - rect.left) / pxPerInch;
    const mouseYin = (e.clientY - rect.top) / pxPerInch;
    let newX = Math.round(mouseXin - offsetXin);
    let newY = Math.round(mouseYin - offsetYin);
    newX = Math.max(0, Math.min(benchW - comp.w, newX));
    newY = Math.max(0, Math.min(benchD - comp.d, newY));
    setPlaced(prev => prev.map(p => p.id === id ? { ...p, x: newX, y: newY } : p));
  }

  function onCanvasMouseUp() {
    dragState.current = null;
    setDraggingId(null);
  }

  function clearSelection() { setSelectedId(null); }

  useEffect(() => {
    window.addEventListener('mouseup', onCanvasMouseUp);
    return () => window.removeEventListener('mouseup', onCanvasMouseUp);
  }, []);

  // Grid lines
  const gridLines = [];
  for (let x = 0; x <= benchW; x++) {
    const isMajor = x % 6 === 0;
    gridLines.push(
      <line key={`vx${x}`} x1={x * pxPerInch} y1={0} x2={x * pxPerInch} y2={canvasH}
        stroke={isMajor ? '#D9E2EE' : '#EEF2F7'} strokeWidth={isMajor ? 1 : 0.5} />
    );
  }
  for (let y = 0; y <= benchD; y++) {
    const isMajor = y % 6 === 0;
    gridLines.push(
      <line key={`hy${y}`} x1={0} y1={y * pxPerInch} x2={canvasW} y2={y * pxPerInch}
        stroke={isMajor ? '#D9E2EE' : '#EEF2F7'} strokeWidth={isMajor ? 1 : 0.5} />
    );
  }

  return (
    <div className="canvas-area">
      <div className="canvas-wrap" style={{ width: canvasW }}>
        <div
          ref={canvasRef}
          className="canvas-frame"
          style={{ width: canvasW, height: canvasH }}
          onMouseMove={onCanvasMouseMove}
          onClick={clearSelection}
        >
        <svg className="canvas-grid" width={canvasW} height={canvasH}>
          {gridLines}
        </svg>

        {placed.length === 0 && (
          <div className="canvas-empty">
            Empty floor<br/>
            <span style={{ fontSize: 11, color: 'var(--text-3)' }}>
              Click a component in the library to add it.<br/>
              Grid = 1 inch. Major gridlines = 6 inches.
            </span>
          </div>
        )}

        {placed.map(item => {
          const comp = findComp(item.componentId);
          if (!comp) return null;
          return (
            <div
              key={item.id}
              className={`placed t-${comp.type} ${selectedId === item.id ? 'selected' : ''} ${draggingId === item.id ? 'dragging' : ''}`}
              style={{
                left: item.x * pxPerInch,
                top: item.y * pxPerInch,
                width: comp.w * pxPerInch,
                height: comp.d * pxPerInch,
              }}
              onMouseDown={(e) => onPlacedMouseDown(e, item)}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="placed-header">
                <div className="placed-name">
                  {comp.name}{comp.variant && comp.variant !== 'placeholder' ? ` · ${comp.variant}` : ''}
                </div>
                {selectedId === item.id && (
                  <button
                    className="remove-btn"
                    onClick={(e) => { e.stopPropagation(); removePlaced(item.id); }}
                    title="Remove"
                    aria-label="Remove component"
                  >×</button>
                )}
              </div>
              <div className="placed-footer">
                <span className="placed-dims">{formatDim(comp.w)} × {formatDim(comp.d)}″</span>
                {comp.part && comp.part !== '—' && (
                  <span className="placed-part">{comp.part}</span>
                )}
              </div>
            </div>
          );
        })}
      </div>

      <div className="canvas-caption">
        <span>Floor plan · top-down</span>
        <span>{benchW}″ × {benchD}″ · 1 div = 1 in</span>
      </div>
      </div>
    </div>
  );
}

                  >

                      <div className="pricing-item-name">

                        {comp.part && comp.part !== '—' && <span className="pricing-item-part"> · {comp.part}</span>}
                      </div>
                      <div className="pricing-item-base">{fmt(base)}</div>

                    <label
                      className="pricing-item-custom"
                      onClick={(e) => e.stopPropagation()}
                    >
                      <input
                        type="checkbox"
                        checked={customOn}
                        onChange={() => toggleCustomization(placed.id)}
                      />
                      <span className="pricing-item-custom-label">
                        {customOn ? 'Customization applied' : 'Standard'}
                      </span>
                      {customOn && (
                        <span className="pricing-item-custom-pct">+{customPct}%</span>
                      )}
                    </label>

                    {customOn && (
                      <div
                        className="pricing-item-slider"
                        onClick={(e) => e.stopPropagation()}
                      >
                        <input
                          type="range"
                          min="0"
                          max="100"
                          step="1"
                          value={customPct}
                          onChange={(e) => setCustomizationPct(placed.id, e.target.value)}
                          aria-label="Customization percentage"
                        />
                        <input
                          type="number"
                          min="0"
                          max="100"
                          step="1"
                          value={customPct}
                          onChange={(e) => setCustomizationPct(placed.id, e.target.value)}
                          className="pricing-item-num"
                        />
                        <span className="pricing-item-num-unit">%</span>
                      </div>
                    )}

                    {customOn && markup > 0 && (
                      <div className="pricing-item-markup">
                        <span>Custom markup</span>
                        <span className="mono">+{fmt(markup)}</span>
                      </div>
                    )}

                    <div className="pricing-item-total">
                      <span>Item total</span>
                      <span className="pricing-item-total-amt">{fmt(itemTotal)}</span>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="pricing-divider" />

            <div className="pricing-totals">
              <div className="pricing-row">
                <span className="pricing-row-label">Subtotal</span>
                <span className="pricing-row-amt">{fmt(pricing.subtotal)}</span>
              </div>

              <div className="pricing-discount">
                <div className="pricing-discount-head">
                  <span className="pricing-row-label">Discount on total</span>
                  <div className="pricing-discount-controls">
                    <input
                      type="number"
                      min="0"
                      max="100"
                      step="1"
                      value={discountPct}
                      onChange={(e) => setDiscount(e.target.value)}
                      className="pricing-item-num"
                    />
                    <span className="pricing-item-num-unit">%</span>
                  </div>
                </div>
                <input
                  type="range"
                  min="0"
                  max="50"
                  step="1"
                  value={discountPct}
                  onChange={(e) => setDiscount(e.target.value)}
                  className="pricing-discount-slider"
                  aria-label="Discount percentage"
                />
                {discountPct > 0 && (
                  <div className="pricing-row pricing-row-sub">
                    <span>Discount amount</span>
                    <span className="mono">−{fmt(pricing.discountAmount)}</span>
                  </div>
                )}
              </div>

              <div className="pricing-row pricing-row-final">
                <span className="pricing-row-label-final">Total</span>
                <span className="pricing-row-amt-final">{fmt(pricing.total)}</span>
              </div>
            </div>

            <div className="pricing-disclaimer">
              Base prices are placeholder estimates. Edit values in the source to match your catalog.
            </div>
          </>
        )}
      </div>

      {/* Design intent */}
      <div className="panel-section">
        <div className="panel-h">Design Intent</div>
        {intent
          ? <div className="intent-body" dangerouslySetInnerHTML={{ __html: intent }} />
          : <div className="intent-body intent-empty">Add components from the library to generate a system description.</div>}
      </div>
    </div>
  );
}

/* ============================================================
   COMPONENT EDITOR MODAL — add or edit a library component
============================================================ */
function ComponentEditor({ mode, initial, categories, onSave, onCancel }) {
  const isEdit = mode === 'edit';
  const [name,      setName]      = useState(initial?.name || '');
  const [variant,   setVariant]   = useState(initial?.variant && initial.variant !== 'placeholder' ? initial.variant : '');
  const [category,  setCategory]  = useState(initial?.category || categories[0] || 'Other');
  const [newCategory, setNewCategory] = useState('');
  const [useNewCategory, setUseNewCategory] = useState(initial?.category && !categories.includes(initial.category));
  const [type,      setType]      = useState(initial?.type || 'thirdparty');
  const [w,         setW]         = useState(initial?.w ?? '');
  const [d,         setD]         = useState(initial?.d ?? '');
  const [h,         setH]         = useState(initial?.h ?? '');
  const [weight,    setWeight]    = useState(initial?.weight ?? '');
  const [gasesStr,  setGasesStr]  = useState(Array.isArray(initial?.gases) ? initial.gases.join(', ') : '');
  const [part,      setPart]      = useState(initial?.part && initial.part !== '—' ? initial.part : '');
  const [basePrice, setBasePrice] = useState(initial?.basePrice ?? '');

  const [error, setError] = useState('');

  function handleSubmit(e) {
    e.preventDefault();
    // Validation
    const nameT = name.trim();
    if (!nameT) { setError('Name is required.'); return; }
    const finalCategory = useNewCategory ? newCategory.trim() : category;
    if (!finalCategory) { setError('Category is required.'); return; }
    const wn = parseFloat(w), dn = parseFloat(d), hn = parseFloat(h);
    if (!(wn > 0) || !(dn > 0)) { setError('Width and depth must be positive numbers (inches).'); return; }
    const heightN = isFinite(hn) && hn > 0 ? hn : 0;

    const gases = gasesStr
      .split(',')
      .map(s => s.trim())
      .filter(Boolean);

    const draft = {
      ...(isEdit ? { id: initial.id } : {}),
      name: nameT,
      variant: variant.trim() || '',
      category: finalCategory,
      type: type || 'thirdparty',
      w: wn,
      d: dn,
      h: heightN,
      weight: weight === '' ? null : parseFloat(weight),
      gases,
      part: part.trim() || '—',
      basePrice: basePrice === '' ? 0 : parseFloat(basePrice),
    };
    onSave(draft);
  }

  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal" onClick={e => e.stopPropagation()} role="dialog" aria-modal="true">
        <div className="modal-head">
          <div>
            <div className="modal-eyebrow">{isEdit ? 'Edit component' : 'Add component'}</div>
            <div className="modal-title">{isEdit ? `${initial.name}${initial.variant && initial.variant !== 'placeholder' ? ' · ' + initial.variant : ''}` : 'New library entry'}</div>
          </div>
          <button className="modal-close" onClick={onCancel} aria-label="Close">×</button>
        </div>

        <form className="modal-form" onSubmit={handleSubmit}>
          <div className="form-row">
            <div className="form-field" style={{ flex: 2 }}>
              <label>Name <span className="req">*</span></label>
              <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. ProOx P110" autoFocus />
            </div>
            <div className="form-field" style={{ flex: 2 }}>
              <label>Variant</label>
              <input type="text" value={variant} onChange={e => setVariant(e.target.value)} placeholder="e.g. Compact O₂" />
            </div>
          </div>

          <div className="form-row">
            <div className="form-field" style={{ flex: 2 }}>
              <label>Category <span className="req">*</span></label>
              {!useNewCategory ? (
                <div className="form-row" style={{ gap: 8 }}>
                  <select value={category} onChange={e => setCategory(e.target.value)}>
                    {categories.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <button type="button" className="form-link-btn" onClick={() => setUseNewCategory(true)}>+ New category</button>
                </div>
              ) : (
                <div className="form-row" style={{ gap: 8 }}>
                  <input type="text" value={newCategory} onChange={e => setNewCategory(e.target.value)} placeholder="New category name" />
                  <button type="button" className="form-link-btn" onClick={() => setUseNewCategory(false)}>Use existing</button>
                </div>
              )}
            </div>
            <div className="form-field" style={{ flex: 1 }}>
              <label>Visual style</label>
              <select value={type} onChange={e => setType(e.target.value)}>
                <option value="chamber">Chamber (cool tint)</option>
                <option value="controller">Controller (warm tint)</option>
                <option value="thirdparty">Other (neutral)</option>
              </select>
            </div>
          </div>

          <div className="form-row">
            <div className="form-field"><label>Width <span className="req">*</span></label>
              <div className="form-row-inline">
                <input type="number" step="0.001" value={w} onChange={e => setW(e.target.value)} placeholder="e.g. 8.875" />
                <span className="form-unit">in</span>
              </div>
            </div>
            <div className="form-field"><label>Depth <span className="req">*</span></label>
              <div className="form-row-inline">
                <input type="number" step="0.001" value={d} onChange={e => setD(e.target.value)} placeholder="e.g. 9" />
                <span className="form-unit">in</span>
              </div>
            </div>
            <div className="form-field"><label>Height</label>
              <div className="form-row-inline">
                <input type="number" step="0.001" value={h} onChange={e => setH(e.target.value)} placeholder="e.g. 4.375" />
                <span className="form-unit">in</span>
              </div>
            </div>
            <div className="form-field"><label>Weight</label>
              <div className="form-row-inline">
                <input type="number" step="0.1" value={weight} onChange={e => setWeight(e.target.value)} placeholder="opt." />
                <span className="form-unit">lb</span>
              </div>
            </div>
          </div>

          <div className="form-row">
            <div className="form-field" style={{ flex: 2 }}>
              <label>Part number</label>
              <input type="text" value={part} onChange={e => setPart(e.target.value)} placeholder="e.g. P110" />
            </div>
            <div className="form-field" style={{ flex: 2 }}>
              <label>Base price (USD)</label>
              <div className="form-row-inline">
                <span className="form-unit form-prefix">$</span>
                <input type="number" step="1" min="0" value={basePrice} onChange={e => setBasePrice(e.target.value)} placeholder="0" />
              </div>
            </div>
          </div>

          <div className="form-row">
            <div className="form-field" style={{ flex: 1 }}>
              <label>Gases <span className="form-hint">comma-separated</span></label>
              <input type="text" value={gasesStr} onChange={e => setGasesStr(e.target.value)} placeholder="e.g. O₂, CO₂, N₂" />
            </div>
          </div>

          {error && <div className="form-error">{error}</div>}

          <div className="modal-actions">
            <button type="button" className="btn btn-quiet" onClick={onCancel}>Cancel</button>
            <button type="submit" className="btn btn-primary">{isEdit ? 'Save changes' : 'Add to library'}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ============================================================
   MOUNT
============================================================ */
try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
} catch (e) {
  document.body.innerHTML = '<div style="padding:40px;font-family:monospace;color:#C75F1E;background:#FFF4EC;"><h2>App failed to start</h2><pre>' + (e.stack || e.message) + '</pre></div>';
  console.error(e);
}
</script>
</body>
</html>
